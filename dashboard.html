<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>梦幻西游宝石商人 — 再续前缘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg-deep: #080c12;
  --bg-card: #111820;
  --bg-card-hover: #161e2a;
  --bg-surface: #1a2332;
  --gold: #d4a853;
  --gold-dim: #b8943a;
  --gold-glow: rgba(212,168,83,0.25);
  --emerald: #2ecc71;
  --emerald-dim: #27ae60;
  --ruby: #e74c3c;
  --ruby-dim: #c0392b;
  --amber: #f39c12;
  --text-primary: #e8e6e3;
  --text-secondary: #98958f;
  --text-muted: #66635e;
  --border: #252a33;
  --border-light: #323a47;
  --radius-sm: 8px;
  --radius: 14px;
  --radius-lg: 20px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 48px rgba(0,0,0,0.6);
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg-deep);
  color: var(--text-primary);
  font-family: 'Inter', 'Noto Sans SC', sans-serif;
  line-height: 1.6;
  min-height: 100vh;
  background-image:
    radial-gradient(ellipse at 20% 0%, rgba(212,168,83,0.06) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 100%, rgba(46,204,113,0.04) 0%, transparent 60%),
    radial-gradient(ellipse at 50% 50%, rgba(26,35,50,0.5) 0%, transparent 100%);
}

.container { max-width: 1400px; margin: 0 auto; padding: 0 24px; }

/* ── Header ── */
.header {
  padding: 48px 0 36px;
  text-align: center;
  position: relative;
}
.header::after {
  content: '';
  position: absolute;
  bottom: 0; left: 50%; transform: translateX(-50%);
  width: 120px; height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.header-badge {
  display: inline-block;
  padding: 6px 16px;
  border: 1px solid var(--gold-dim);
  border-radius: 20px;
  font-size: 12px;
  letter-spacing: 0.15em;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 16px;
  backdrop-filter: blur(8px);
  background: rgba(212,168,83,0.06);
}
.header h1 {
  font-family: 'Noto Serif SC', serif;
  font-size: clamp(28px, 5vw, 44px);
  font-weight: 900;
  letter-spacing: 0.04em;
  background: linear-gradient(135deg, #f0d78c 0%, var(--gold) 30%, #c49530 70%, #f0d78c 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}
.header .subtitle { color: var(--text-secondary); font-size: 14px; letter-spacing: 0.08em; }
.header .date-tag {
  display: inline-block;
  margin-top: 12px;
  padding: 4px 14px;
  background: var(--bg-surface);
  border-radius: 6px;
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  color: var(--text-secondary);
}

/* ── Stat Cards ── */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin: 32px 0;
}
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  position: relative;
  overflow: hidden;
  transition: all var(--transition);
  animation: fadeUp 0.6s ease-out both;
}
.stat-card:nth-child(1) { animation-delay: 0.05s; }
.stat-card:nth-child(2) { animation-delay: 0.12s; }
.stat-card:nth-child(3) { animation-delay: 0.19s; }
.stat-card:nth-child(4) { animation-delay: 0.26s; }

.stat-card:hover {
  background: var(--bg-card-hover);
  border-color: var(--border-light);
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}
.stat-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 2px;
}
.stat-card:nth-child(1)::before { background: var(--gold); }
.stat-card:nth-child(2)::before { background: var(--emerald); }
.stat-card:nth-child(3)::before { background: #3498db; }
.stat-card:nth-child(4)::before { background: var(--ruby); }

.stat-card .stat-icon { font-size: 28px; margin-bottom: 8px; }
.stat-card .stat-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; }
.stat-card .stat-value { font-family: 'DM Mono', monospace; font-size: 32px; font-weight: 500; margin: 4px 0; }
.stat-card:nth-child(1) .stat-value { color: var(--gold); }
.stat-card:nth-child(2) .stat-value { color: var(--emerald); }
.stat-card:nth-child(3) .stat-value { color: #3498db; }
.stat-card:nth-child(4) .stat-value { color: var(--ruby); }
.stat-card .stat-detail { font-size: 12px; color: var(--text-secondary); }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ── Chart Section ── */
.section-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 20px;
  font-weight: 700;
  margin: 40px 0 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.section-title::before {
  content: '';
  width: 3px; height: 20px;
  background: var(--gold);
  border-radius: 2px;
}
.chart-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 40px;
}
.chart-box {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  transition: all var(--transition);
}
.chart-box:hover { border-color: var(--border-light); box-shadow: var(--shadow); }
.chart-box canvas { max-height: 360px; }

/* ── Starstone Highlight ── */
.starstone-feature {
  background: linear-gradient(135deg, rgba(212,168,83,0.08) 0%, rgba(212,168,83,0.02) 50%, rgba(212,168,83,0.08) 100%);
  border: 1px solid var(--gold-dim);
  border-radius: var(--radius-lg);
  padding: 28px 32px;
  margin: 32px 0;
  position: relative;
  overflow: hidden;
  animation: glowPulse 3s ease-in-out infinite;
}
@keyframes glowPulse {
  0%, 100% { box-shadow: 0 0 20px rgba(212,168,83,0.08), inset 0 0 20px rgba(212,168,83,0.02); }
  50% { box-shadow: 0 0 40px rgba(212,168,83,0.15), inset 0 0 30px rgba(212,168,83,0.04); }
}
.starstone-feature .ss-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}
.starstone-feature .ss-icon {
  font-size: 36px;
  filter: drop-shadow(0 0 8px rgba(212,168,83,0.5));
  animation: iconFloat 2s ease-in-out infinite;
}
@keyframes iconFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}
.starstone-feature .ss-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--gold);
}
.starstone-feature .ss-subtitle { color: var(--text-secondary); font-size: 13px; }
.starstone-feature .ss-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
}
.ss-cell {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 16px;
  text-align: center;
}
.ss-cell .ss-lv { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; }
.ss-cell .ss-price { font-family: 'DM Mono', monospace; font-size: 22px; font-weight: 500; color: var(--gold); margin: 4px 0; }
.ss-cell .ss-count { font-size: 11px; color: var(--text-secondary); }

/* ── Gem Tables ── */
.gem-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 48px; }
.gem-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: all var(--transition); }
.gem-item:hover { border-color: var(--border-light); }
.gem-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 24px;
  cursor: pointer;
  user-select: none;
  transition: background var(--transition);
}
.gem-header:hover { background: var(--bg-card-hover); }
.gem-header-left { display: flex; align-items: center; gap: 14px; }
.gem-emoji { font-size: 24px; }
.gem-name { font-family: 'Noto Serif SC', serif; font-size: 17px; font-weight: 700; }
.gem-meta { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.gem-header-right { display: flex; align-items: center; gap: 20px; }
.gem-lv5-price { text-align: right; }
.gem-lv5-price .label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; }
.gem-lv5-price .price { font-family: 'DM Mono', monospace; font-size: 18px; font-weight: 500; }
.gem-arrow {
  font-size: 14px; color: var(--text-muted);
  transition: transform var(--transition);
}
.gem-item.open .gem-arrow { transform: rotate(180deg); }

.gem-table-wrap {
  display: none;
  padding: 0 24px 20px;
  animation: slideDown 0.3s ease-out;
}
.gem-item.open .gem-table-wrap { display: block; }
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}

.gem-table { width: 100%; border-collapse: collapse; }
.gem-table th {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--text-muted); padding: 10px 14px; text-align: center;
  border-bottom: 1px solid var(--border);
}
.gem-table td {
  padding: 10px 14px; text-align: center;
  font-family: 'DM Mono', monospace; font-size: 13px;
  border-bottom: 1px solid rgba(37,42,51,0.5);
}
.gem-table .lv-cell { font-weight: 600; color: var(--text-primary); font-size: 14px; }
.price-high { color: var(--ruby); }
.price-mid { color: var(--amber); }
.price-low { color: var(--emerald); }

/* ── DoD Tags ── */
.dod-tag { font-size: 11px; margin-left: 4px; }
.dod-up { color: var(--emerald); }
.dod-down { color: var(--ruby); }

/* ── Rate Bar ── */
.rate-bar {
  display: flex; align-items: center; gap: 16px;
  background: linear-gradient(135deg, rgba(212,168,83,0.1), rgba(212,168,83,0.03));
  border: 1px solid var(--gold-dim);
  border-radius: var(--radius);
  padding: 16px 24px;
  margin: 24px 0;
  font-size: 13px; color: var(--text-secondary);
}
.rate-bar .rate-icon { font-size: 22px; }
.rate-bar .rate-label { font-weight: 600; color: var(--gold); letter-spacing: 0.06em; text-transform: uppercase; font-size: 11px; }
.rate-bar .rate-value strong { color: var(--text-primary); font-family: 'DM Mono', monospace; }
.rate-bar .rate-sep { color: var(--border-light); }

/* ── Footer ── */
.footer {
  text-align: center;
  padding: 40px 0;
  border-top: 1px solid var(--border);
  margin-top: 24px;
}
.footer p { color: var(--text-muted); font-size: 12px; }

/* ── Responsive ── */
@media (max-width: 900px) {
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .chart-grid { grid-template-columns: 1fr; }
  .gem-header { padding: 14px 16px; }
  .gem-header-right { gap: 10px; }
  .gem-lv5-price .price { font-size: 15px; }
  .rate-bar { flex-wrap: wrap; gap: 8px 12px; padding: 12px 16px; font-size: 12px; }
  .rate-bar .rate-sep:nth-of-type(2) { display: none; }
}

@media (max-width: 768px) {
  .header { padding: 36px 0 28px; }
  .header h1 { font-size: 26px; }
  .header .subtitle { font-size: 12px; }
  .header-badge { font-size: 10px; padding: 4px 12px; }
  .stat-card { padding: 18px; }
  .stat-card .stat-value { font-size: 26px; }
  .stat-card .stat-icon { font-size: 24px; }
  .stats-grid { gap: 12px; }
  .section-title { font-size: 17px; margin: 28px 0 14px; }
  .chart-box { padding: 16px; }
  .chart-box canvas { max-height: 280px; }
  .starstone-feature { padding: 20px; }
  .starstone-feature .ss-title { font-size: 18px; }
  .starstone-feature .ss-icon { font-size: 28px; }
  .starstone-feature .ss-subtitle { font-size: 12px; margin-top: 2px; }
  .gem-header-left { gap: 10px; }
  .gem-emoji { font-size: 20px; }
  .gem-name { font-size: 15px; }
  .gem-meta { font-size: 11px; }
  .gem-table-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding: 0 10px 16px;
  }
  .gem-table { min-width: 620px; }
  .gem-table th { padding: 8px 6px; font-size: 9px; white-space: nowrap; }
  .gem-table td { padding: 8px 6px; font-size: 11px; white-space: nowrap; }
  .rate-bar { padding: 12px; font-size: 11px; gap: 6px 10px; }
  .rate-bar .rate-sep { display: none; }
  .rate-bar .rate-value { flex: 1 1 auto; }
  .footer { padding: 28px 0; }
  .footer p { font-size: 11px; }
}

@media (max-width: 500px) {
  .stats-grid { grid-template-columns: 1fr; gap: 10px; }
  .stat-card { padding: 14px 16px; }
  .stat-card .stat-value { font-size: 24px; }
  .container { padding: 0 12px; }
  .header { padding: 28px 0 20px; }
  .header h1 { font-size: 22px; }
  .header .date-tag { font-size: 11px; padding: 3px 10px; }
  .starstone-feature { padding: 16px; margin: 24px 0; }
  .starstone-feature .ss-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .starstone-feature .ss-header { gap: 8px; margin-bottom: 12px; }
  .ss-cell { padding: 12px 10px; }
  .ss-cell .ss-price { font-size: 18px; }
  .rate-bar { flex-direction: column; gap: 4px; padding: 10px 14px; font-size: 11px; }
  .rate-bar .rate-value { font-size: 11px; }
  .gem-header { flex-wrap: wrap; gap: 6px; padding: 12px 14px; }
  .gem-header-left { flex: 1 1 100%; }
  .gem-header-right { width: 100%; justify-content: space-between; }
  .gem-lv5-price { text-align: left; display: flex; align-items: baseline; gap: 6px; }
  .gem-lv5-price .label { font-size: 10px; }
  .gem-lv5-price .price { font-size: 15px; }
  .gem-arrow { display: none; }
  .chart-box { padding: 12px; }
  .chart-box canvas { max-height: 240px; }
  .section-title { font-size: 15px; }
  .footer { padding: 20px 0; }
  .footer p { font-size: 10px; }
}

@media (max-width: 380px) {
  .header h1 { font-size: 20px; }
  .starstone-feature .ss-grid { grid-template-columns: 1fr 1fr; gap: 6px; }
  .ss-cell .ss-price { font-size: 16px; }
  .ss-cell .ss-lv { font-size: 10px; }
  .ss-cell .ss-count { font-size: 10px; }
  .chart-box canvas { max-height: 200px; }
  .rate-bar { padding: 8px 10px; font-size: 10px; }
}
</style>
</head>

  <!-- Gem Detail Tables -->

  <footer class="footer">

</div>

  });

  new Chart(document.getElementById('chartVolume'), {
    type: 'bar',
    data: {
      labels: names,
      datasets: [{
        label: '在售数量',
        data: totals,
        backgroundColor: ['rgba(46,204,113,0.6)','rgba(46,204,113,0.6)','rgba(46,204,113,0.9)','rgba(46,204,113,0.5)','rgba(46,204,113,0.6)','rgba(46,204,113,0.6)','rgba(46,204,113,0.6)','rgba(46,204,113,0.6)'],
        borderColor: 'rgba(46,204,113,0.8)',
        borderWidth: 1,
        borderRadius: 6,
      }]
    },
    options: {
      responsive: true,
      plugins: {
        title: { display: true, text: '各宝石在售数量分布', font: { size: 16, family: "'Noto Serif SC',serif", weight:'700' }, color: '#e8e6e3', padding:20 },
        legend: { display: false }
      },
      scales: {
        y: { grid: { color: 'rgba(37,42,51,0.6)' } },
        x: { grid: { display: false } }
      }
    }
  });
})();

// ── Stat Card Rendering + DoD ──
(function() {
  const total = GEMS.reduce((s, g) => s + DATA[g].total, 0);
  document.getElementById('stat-total').textContent = total.toLocaleString();

  let maxG = GEMS[0];
  GEMS.forEach(g => { if (DATA[g].total > DATA[maxG].total) maxG = g; });
  document.getElementById('stat-market').textContent = maxG;
  document.getElementById('stat-market-detail').textContent =
    `${DATA[maxG].total} 条在售 · ${(DATA[maxG].total / total * 100).toFixed(1)}%`;

  let maxItem = null;
  GEMS.forEach(g => {
    Object.entries(DATA[g].levels).forEach(([lv, d]) => {
      if (!maxItem || d.max > maxItem.price) maxItem = { gem: g, level: lv, price: d.max };
    });
  });
  document.getElementById('stat-max').textContent =
    '¥' + maxItem.price.toLocaleString();
  document.getElementById('stat-max-detail').textContent =
    `${maxItem.gem} · ${maxItem.level}级`;

  // DoD
  if (DOD.total !== "--") {
    const up = DOD.total.startsWith("+");
    document.getElementById('dod-total').textContent = `较昨日 ${DOD.total}`;
    document.getElementById('dod-total').className = 'dod-tag ' + (up ? 'dod-up' : 'dod-down');
  }
  if (DOD.max_price !== "--") {
    const up = DOD.max_price.startsWith("+");
    const sd = document.getElementById('stat-max-detail');
    const span = document.createElement('span');
    span.textContent = ` · 较昨日 ${DOD.max_price}`;
    span.className = 'dod-tag ' + (up ? 'dod-up' : 'dod-down');
    span.style.marginLeft = '4px';
    sd.appendChild(span);
  }
})();

// ── Rate Bar ──
(function() {
  if (!RATE || !RATE.mh_per_rmb) return;
  document.getElementById('rate-bar').style.display = '';
  document.getElementById('rate-mh').textContent = RATE.mh_per_rmb.toLocaleString();
  document.getElementById('rate-unit').textContent = RATE.unit_price.toFixed(4);
  document.getElementById('rate-eff').textContent = RATE.effective_rate.toFixed(4);
})();

// ── Trend Charts ──
(function() {
  if (!HISTORY || !HISTORY.dates || HISTORY.dates.length < 2) return;

  document.getElementById('trend-title').style.display = '';
  document.getElementById('trend-section').style.display = '';

  const dates = HISTORY.dates;
  const gemColors = {
    '太阳石': '#e74c3c', '月亮石': '#3498db', '光芒石': '#2ecc71',
    '黑宝石': '#9b59b6', '红玛瑙': '#e67e22', '舍利子': '#1abc9c',
    '星辉石': '#f1c40f', '翡翠石': '#2ecc71'
  };
  const gemDashes = {
    '星辉石': [], '太阳石': [6,3], '月亮石': [2,2], '光芒石': [],
    '黑宝石': [6,3], '红玛瑙': [10,4], '舍利子': [2,2], '翡翠石': [10,4]
  };

  const trendDatasets = GEMS.map(g => ({
    label: g,
    data: HISTORY.gems[g].lv5_avg,
    borderColor: gemColors[g],
    backgroundColor: gemColors[g] + '20',
    borderWidth: g === '星辉石' ? 3 : 1.5,
    borderDash: gemDashes[g] || [],
    pointRadius: g === '星辉石' ? 4 : 2,
    pointHoverRadius: 6,
    tension: 0.3,
    fill: false,
  }));

  new Chart(document.getElementById('chartTrendLv5'), {
    type: 'line',
    data: { labels: dates, datasets: trendDatasets },
    options: {
      responsive: true,
      interaction: { mode: 'nearest', intersect: false },
      plugins: {
        title: { display: true, text: '5级均价走势', font: { size: 16, family: "'Noto Serif SC',serif", weight: '700' }, color: '#e8e6e3', padding: 20 },
        tooltip: { callbacks: { label: ctx => ctx.dataset.label + ': ¥' + ctx.raw.toFixed(2) } }
      },
      scales: {
        y: { grid: { color: 'rgba(37,42,51,0.6)' }, ticks: { callback: v => '¥' + v } },
        x: { grid: { display: false } }
      }
    }
  });

  const volDatasets = GEMS.map(g => ({
    label: g,
    data: HISTORY.gems[g].total,
    borderColor: gemColors[g],
    backgroundColor: gemColors[g] + '20',
    borderWidth: 1.5,
    borderDash: gemDashes[g] || [],
    pointRadius: 2,
    pointHoverRadius: 5,
    tension: 0.3,
    fill: false,
  }));

  new Chart(document.getElementById('chartTrendVolume'), {
    type: 'line',
    data: { labels: dates, datasets: volDatasets },
    options: {
      responsive: true,
      interaction: { mode: 'nearest', intersect: false },
      plugins: {
        title: { display: true, text: '在售数量走势', font: { size: 16, family: "'Noto Serif SC',serif", weight: '700' }, color: '#e8e6e3', padding: 20 },
      },
      scales: {
        y: { grid: { color: 'rgba(37,42,51,0.6)' } },
        x: { grid: { display: false } }
      }
    }
  });
})();

// ── Gem Detail Tables ──
(function() {
  const list = document.getElementById('gem-list');
  GEMS.forEach((gem, idx) => {
    const d = DATA[gem];
    const levels = Object.entries(d.levels).sort((a,b) => +a[0] - +b[0]);

    const item = document.createElement('div');
    item.className = 'gem-item';
    item.style.animation = `fadeUp 0.5s ease-out ${0.08 * (idx+1)}s both`;

    const isStar = gem === '星辉石';
    if (isStar) item.style.borderColor = 'var(--gold-dim)';

    const header = document.createElement('div');
    header.className = 'gem-header';
    const buyData = SUGGESTED_BUY[gem];
    const hasBuy = buyData && buyData.l1_mh > 0;
    let buyInfo = '';
    if (hasBuy && buyData.levels) {
      const l1 = buyData.levels['1'];
      const l5 = buyData.levels['5'];
      if (l1) {
        const l1w = Math.round(l1.buy_mh / 10000);
        buyInfo = ` · 一级收: ${l1w}万 MH`;
        if (l5) buyInfo += ` · 五级收: ${Math.round(l5.buy_mh / 10000)}万 MH`;
        buyInfo += ` (已留10%利润)`;
      }
    }
    header.innerHTML = `
      <div class="gem-header-left">
        <span class="gem-emoji">${GEM_EMOJI[gem]}</span>
        <div>
          <div class="gem-name" style="${isStar ? 'color:var(--gold);' : ''}">${gem}${isStar ? ' ⭐' : ''}</div>
          <div class="gem-meta">${d.total} 条 · ${d.level_range}级 · 最高 ¥${d.max_price.toLocaleString()}${buyInfo}</div>
        </div>
      </div>
      <div class="gem-header-right">
        <div class="gem-lv5-price">
          <div class="label">5级均价</div>
          <div class="price" style="color:${d.lv5_avg <= 11 ? 'var(--emerald)' : d.lv5_avg >= 50 ? 'var(--ruby)' : 'var(--amber)'}">¥${d.lv5_avg.toFixed(2)}</div>
        </div>
        <span class="gem-arrow">▾</span>
      </div>`;
    header.addEventListener('click', () => item.classList.toggle('open'));

    const wrap = document.createElement('div');
    wrap.className = 'gem-table-wrap';
    let rows = '';
    let prevAvg = null;
    levels.forEach(([lv, lvd]) => {
      const priceClass = lvd.avg <= 15 ? 'price-low' : lvd.avg >= 500 ? 'price-high' : 'price-mid';
      let profit = '-';
      if (prevAvg !== null && prevAvg > 0) {
        const val = lvd.avg - prevAvg * 3;
        const cls = val > 0 ? 'price-high' : 'price-low';
        profit = `<span class="${cls}">${val >= 0 ? "+" : ""}¥${val.toFixed(0)}</span>`;
      }
      let buyCell = '';
      if (hasBuy && buyData.levels && buyData.levels[lv]) {
        const bd = buyData.levels[lv];
        const lvBuy = Math.round(bd.buy_mh / 10000);
        const flagStyle = bd.flag ? 'background:rgba(231,76,60,0.15);color:var(--ruby)' : 'color:var(--gold)';
        const flagIcon = bd.flag ? ' ⚠' : '';
        buyCell = `<td style="font-family:'DM Mono',monospace;${flagStyle}">${lvBuy}万${flagIcon}</td>`;
      } else if (hasBuy) {
        buyCell = '<td style="color:var(--text-muted)">-</td>';
      }
      rows += `<tr>
        <td class="lv-cell">${lv} 级</td>
        <td>${lvd.count}</td>
        <td class="price-low">¥${lvd.min}</td>
        <td class="price-high">¥${lvd.max}</td>
        <td class="${priceClass}">¥${lvd.avg.toFixed(2)}</td>
        <td style="color:var(--text-muted);font-size:11px">${(lvd.count/d.total*100).toFixed(1)}%</td>
        ${buyCell}
        <td style="font-size:12px">${profit}</td>
      </tr>`;
      prevAvg = lvd.avg;
    });
    wrap.innerHTML = `<table class="gem-table">
      <thead><tr><th>等级</th><th>数量</th><th>最低</th><th>最高</th><th>均价</th><th>占比</th>${hasBuy ? '<th>收购(MH)</th>' : ''}<th>合成盈亏</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
    item.appendChild(header);
    item.appendChild(wrap);
    list.appendChild(item);
  });
})();
</script>
</body>
</html>
